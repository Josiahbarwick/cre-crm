<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAI Pfefferle CRM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="authRoot"></div>

<div id="app" style="display:none;">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo-plate" data-tooltip="Make Wally happy"><img src="logo.svg" alt="NAI Pfefferle"></div>
      <div class="brand-suffix">CRM</div>
    </div>
    <nav class="nav">
      <a href="#dashboard" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>Dashboard</a>
      <a href="#coldcall" data-route="coldcall"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1.1L6.6 10.8z"/></svg>Cold Call</a>
      <a href="#prospects" data-route="prospects"><svg viewBox="0 0 24 24"><path d="M16 11c1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3 1.3 3 3 3zm-8 0c1.7 0 3-1.3 3-3S9.7 5 8 5 5 6.3 5 8s1.3 3 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5c0-2.3-4.7-3.5-7-3.5zm8 0c-.3 0-.6 0-.9.1 1.1.8 1.9 1.9 1.9 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/></svg>Prospects</a>
      <a href="#listings" data-route="listings"><svg viewBox="0 0 24 24"><path d="M5 3h14a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 4v2h10V7H7zm0 4v2h10v-2H7zm0 4v2h6v-2H7z"/></svg>Listings</a>
      <a href="#deals" data-route="deals"><svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4z"/></svg>Deals Pipeline</a>
      <a href="#commissions" data-route="commissions"><svg viewBox="0 0 24 24"><path d="M11.8 2v2.2c-2.6.3-4.6 1.6-4.6 3.9 0 2.5 2.1 3.4 4.6 4.1v4.3c-1.1-.2-1.9-.8-2-1.8H7.1c.1 2.2 1.7 3.6 4.1 3.9V21h1.6v-2.4c2.7-.3 4.7-1.7 4.7-4.1 0-2.6-2.2-3.5-4.7-4.2V6.2c.9.2 1.5.8 1.6 1.6h2.6c-.1-2-1.6-3.3-3.7-3.5V2h-1.5zm0 4.2v3.7c-1.3-.4-2.1-.9-2.1-1.9 0-.9.7-1.6 2.1-1.8zm1.5 6.1c1.5.4 2.3 1 2.3 2 0 1.1-.9 1.7-2.3 1.9v-3.9z"/></svg>Commissions</a>
      <a href="#goals" data-route="goals"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 16a6 6 0 1 1 6-6 6 6 0 0 1-6 6zm0-9a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/></svg>Goals</a>
      <a href="#individuals" data-route="individuals"><svg viewBox="0 0 24 24"><path d="M12 2a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM3 11h2a1 1 0 0 1 0 2H3a1 1 0 0 1 0-2zm16 0h2a1 1 0 0 1 0 2h-2a1 1 0 0 1 0-2zM12 19a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1z"/></svg>Individuals</a>
      <a href="#pool" data-route="pool"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 4a2 2 0 1 1-2 2 2 2 0 0 1 2-2zm-4.5 9.5a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5zm5.5 2a1.25 1.25 0 1 1 1.25-1.25A1.25 1.25 0 0 1 13 17.5zm4-6a1.75 1.75 0 1 1 1.75-1.75A1.75 1.75 0 0 1 17 11.5z"/></svg>Pool Room</a>
      <a href="#news" data-route="news"><svg viewBox="0 0 24 24"><path d="M4 4h13a2 2 0 0 1 2 2v13a1 1 0 0 0 1-1V7h1v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4zm2 2v3h9V6H6zm0 5v2h9v-2H6zm0 4v2h6v-2H6z"/></svg>News &amp; Updates</a>
      <a href="#activity" data-route="activity"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3z"/><path d="M13 3v9l7 3"/></svg>Activity Log</a>
    </nav>
    <div class="sidebar-footer">
      <div id="whoami" class="whoami"></div>
      <button id="exportBtn" class="ghost-btn">Export data</button>
      <label class="ghost-btn" for="importInput">Import data</label>
      <input type="file" id="importInput" accept="application/json" hidden>
      <button id="seedBtn" class="ghost-btn subtle">Load sample data</button>
      <button id="wipeBtn" class="ghost-btn subtle danger">Clear all data</button>
      <button id="signOutBtn" class="ghost-btn subtle">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" class="search-icon"><path d="M21 20l-5.6-5.6a7.5 7.5 0 1 0-1.4 1.4L20 21l1-1zM4 10.5A6.5 6.5 0 1 1 10.5 17 6.5 6.5 0 0 1 4 10.5z"/></svg>
        <input id="globalSearch" placeholder="Search by name, company, or address…">
      </div>
      <div class="topbar-right">
        <div class="today" id="todayLabel"></div>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>

</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
